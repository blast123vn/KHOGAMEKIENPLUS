services:
  - type: web
    name: gamevault-secure
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn server:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: gamevault-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GAMEVAULT_DB
        value: /var/data/gamevault.db
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_REVEAL_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GAME_PASSWORD_KEY
        sync: false
